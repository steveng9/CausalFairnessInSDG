[project]
name = "causal-fairness-sdg"
version = "0.1.0"
description = "Causal-graph fairness mechanisms (FTU/DP/CF/DF, a la DECAF) for graphical/marginal-based DP synthetic data generators (MST, PrivBayes, ...)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "scikit-learn",
    "scipy",
    "disjoint-set",
    "ucimlrepo",
    "private-pgm @ git+https://github.com/ryan112358/private-pgm.git",
]

[project.optional-dependencies]
dev = ["pytest"]
# DECAF is a non-private GAN baseline (see sdg/decaf.py), conceptually
# separate from the core graphical/marginal DP-synthesizer family this
# project targets -- kept optional since it pulls in torch + pytorch-
# lightning, a much heavier footprint than the rest of the project.
decaf = ["decaf-synthetic-data"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises real model training (DECAF/PrivBayes/AIM/PrivSyn GAN or structure-search fits)",
]
